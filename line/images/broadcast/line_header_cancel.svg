<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" width="1040" height="520">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C3E50"/>
      <stop offset="100%" stop-color="#34495E"/>
    </linearGradient>
    <linearGradient id="redband" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C0392B"/>
      <stop offset="100%" stop-color="#E74C3C"/>
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="1040" height="520" fill="url(#bg5)"/>

  <!-- Subtle dot grid texture -->
  <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1.5" fill="white" fill-opacity="0.04"/>
  </pattern>
  <rect width="1040" height="520" fill="url(#dots)"/>

  <!-- Red top band -->
  <rect x="0" y="0" width="1040" height="90" fill="url(#redband)"/>

  <!-- Alert icon in red band -->
  <g transform="translate(60, 18)">
    <!-- Warning triangle -->
    <polygon points="27,4 54,50 0,50" fill="none" stroke="white" stroke-width="3" stroke-linejoin="round"/>
    <text x="27" y="40" font-family="Arial" font-size="22" font-weight="900" fill="white" text-anchor="middle">!</text>
  </g>

  <!-- Alert text in red band -->
  <text x="145" y="38" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="18" font-weight="700" fill="white" letter-spacing="3">緊急のお知らせ</text>
  <text x="145" y="68" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="28" font-weight="900" fill="white" letter-spacing="2">URGENT NOTICE</text>

  <!-- Main content area -->
  <!-- Big cancel text -->
  <text x="80" y="230" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="80" font-weight="900" fill="white" letter-spacing="-2">活動中止</text>

  <!-- Red underline -->
  <rect x="80" y="245" width="480" height="5" rx="2.5" fill="url(#redband)"/>

  <!-- Reason line -->
  <text x="80" y="305" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="26" fill="white" fill-opacity="0.75">本日の活動は中止となりました</text>

  <!-- Detail box -->
  <rect x="80" y="330" width="500" height="80" rx="12" fill="white" fill-opacity="0.06" stroke="white" stroke-width="1" stroke-opacity="0.15"/>
  <text x="100" y="360" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="14" fill="white" fill-opacity="0.6" letter-spacing="1">理由</text>
  <text x="100" y="390" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="20" font-weight="600" fill="white">天候・施設事情などによる</text>

  <!-- Right decoration -->
  <text x="700" y="350" font-family="Arial, sans-serif" font-size="180" font-weight="900" fill="white" fill-opacity="0.04">×</text>

  <!-- Bottom strip -->
  <rect x="0" y="460" width="1040" height="60" fill="#1A252F"/>
  <rect x="0" y="460" width="1040" height="2" fill="#E74C3C" fill-opacity="0.6"/>
  <text x="80" y="498" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="20" font-weight="600" fill="white" fill-opacity="0.7" letter-spacing="2">ボーイスカウト杉並5団</text>
  <text x="800" y="498" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="16" fill="white" fill-opacity="0.5">詳しくは本文をご確認ください</text>
</svg>
